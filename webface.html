<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BARMITZVAPROJECT - ALPHA</title>
  <style>
    :root {
      --bg-color: #f5f5f5;
      --container-bg: #ffffff;
      --text-color: #222222;
      --user-msg-bg: #d1fae5;
      --other-msg-bg: #e5e7eb;
      --input-bg: #ffffff;
      --primary-color: #10b981;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    body.dark {
      --bg-color: #1e1e1e;
      --container-bg: #2a2a2a;
      --text-color: #f5f5f5;
      --user-msg-bg: #065f46;
      --other-msg-bg: #374151;
      --input-bg: #1f2937;
      --primary-color: #34d399;
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .chat-container {
      background: var(--container-bg);
      width: 100%;
      max-width: 600px;
      height: 600px;
      border-radius: 16px;
      box-shadow: 0 20px 40px var(--shadow-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      right: 20px;
      top: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      animation: slideIn 0.3s ease-out;
      word-wrap: break-word;
    }

    .message.user {
      background: var(--user-msg-bg);
      color: black;
      align-self: flex-end;
    }

    .message.other {
      background: var(--other-msg-bg);
      color: black;
      align-self: flex-start;
    }

    body.dark .message.user,
    body.dark .message.other {
      color: white;
    }

    .message-time {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .chat-input-container {
      padding: 20px;
      display: flex;
      gap: 10px;
      background: var(--input-bg);
      border-top: 1px solid #ccc;
      transition: background 0.3s ease;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 20px;
      border: 2px solid #ccc;
      outline: none;
      background: var(--input-bg);
      color: var(--text-color);
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      color: #aaa;
      font-style: italic;
      margin-top: 50px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      BARMITZVAPROJECT - ALPHA
      <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">Start a conversation...</div>
    </div>
    <div class="chat-input-container">
      <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." maxlength="500">
      <button class="send-button" id="sendButton" disabled>Send</button>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");
    const themeToggle = document.getElementById("themeToggle");

    const messages = [];

    function formatTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(text, isUser = true) {
      messages.push({ text, isUser, time: formatTime() });
      renderMessages();

      if (isUser) {
        setTimeout(() => {
          const replies = [
            "Thanks for your message!",
            "Got it!",
            "Interesting...",
            "Nice one!",
            "Okay!",
            "Cool!"
          ];
          const reply = replies[Math.floor(Math.random() * replies.length)];
          addMessage(reply, false);
        }, 1000);
      }
    }

    function renderMessages() {
      if (messages.length === 0) {
        chatMessages.innerHTML = '<div class="empty-state">Start a conversation...</div>';
        return;
      }

      chatMessages.innerHTML = messages.map(msg => `
        <div class="message ${msg.isUser ? 'user' : 'other'}">
          <div>${msg.text}</div>
          <div class="message-time">${msg.time}</div>
        </div>
      `).join("");

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        addMessage(text, true);
        messageInput.value = "";
        sendButton.disabled = true;
      }
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("input", () => {
      sendButton.disabled = messageInput.value.trim() === "";
    });
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Toggle light/dark mode
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });
  </script>
</body>
</html>
