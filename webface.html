<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 50%, #15803d 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .app-title {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
            text-align: center;
        }

        .app-container {
            width: 800px;
            height: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-chat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .sidebar-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-item-content {
            flex: 1;
            min-width: 0;
        }

        .chat-item-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .chat-item-preview {
            font-size: 12px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat-btn {
            background: rgba(255, 0, 0, 0.1);
            border: none;
            color: #ef4444;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            margin-left: 8px;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .chat-item.active .delete-chat-btn {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-item.active .delete-chat-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.other {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .chat-input-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }

        .send-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 60px;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.3);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(74, 222, 128, 0.3);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(74, 222, 128, 0.5);
        }

        .chat-item:hover:not(.active) {
            background: rgba(74, 222, 128, 0.1);
            border-color: rgba(74, 222, 128, 0.2);
        }

        .chat-item.active {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: #888;
            font-style: italic;
            margin-top: 50px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .modal-input:focus {
            border-color: #4ade80;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
        }

        .modal-btn.primary:hover {
            transform: translateY(-1px);
        }

        .modal-btn.secondary {
            background: #f0f0f0;
            color: #666;
        }

        .modal-btn.secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="app-title">BARMITZVAPROJECT-ALPHA</div>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>💬 Conversations</span>
                <button class="add-chat-btn" id="addChatBtn">+</button>
            </div>
            <div class="sidebar-content">
                <div class="chat-list" id="chatList">
                    <div class="chat-item active" data-chat="general">
                        <div class="chat-item-content">
                            <div class="chat-item-name">General Chat</div>
                            <div class="chat-item-preview">Start a conversation...</div>
                        </div>
                        <button class="delete-chat-btn" data-action="delete">×</button>
                    </div>
                    <div class="chat-item" data-chat="work">
                        <div class="chat-item-content">
                            <div class="chat-item-name">Work Discussion</div>
                            <div class="chat-item-preview">No messages yet</div>
                        </div>
                        <button class="delete-chat-btn" data-action="delete">×</button>
                    </div>
                    <div class="chat-item" data-chat="friends">
                        <div class="chat-item-content">
                            <div class="chat-item-name">Friends</div>
                            <div class="chat-item-preview">No messages yet</div>
                        </div>
                        <button class="delete-chat-btn" data-action="delete">×</button>
                    </div>
                    <div class="chat-item" data-chat="random">
                        <div class="chat-item-content">
                            <div class="chat-item-name">Random Thoughts</div>
                            <div class="chat-item-preview">No messages yet</div>
                        </div>
                        <button class="delete-chat-btn" data-action="delete">×</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                💬 <span id="currentChatName">General Chat</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">Start a conversation...</div>
            </div>
            
            <div class="chat-input-container">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    maxlength="500"
                >
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <!-- Modal for creating new chat -->
    <div class="modal" id="createChatModal">
        <div class="modal-content">
            <div class="modal-header">Create New Chat</div>
            <input type="text" class="modal-input" id="chatNameInput" placeholder="Enter chat name..." maxlength="30">
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
                <button class="modal-btn primary" id="createBtn">Create</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatList = document.getElementById('chatList');
        const currentChatName = document.getElementById('currentChatName');
        const addChatBtn = document.getElementById('addChatBtn');
        const createChatModal = document.getElementById('createChatModal');
        const chatNameInput = document.getElementById('chatNameInput');
        const createBtn = document.getElementById('createBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        let allChats = {
            general: [],
            work: [],
            friends: [],
            random: []
        };
        
        let chatNames = {
            general: 'General Chat',
            work: 'Work Discussion',
            friends: 'Friends',
            random: 'Random Thoughts'
        };
        
        let currentChat = 'general';
        let chatCounter = 0;

        function formatTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function generateChatId() {
            return 'chat_' + (++chatCounter) + '_' + Date.now();
        }

        function createChatItem(chatKey, chatName) {
            return `
                <div class="chat-item ${chatKey === currentChat ? 'active' : ''}" data-chat="${chatKey}">
                    <div class="chat-item-content">
                        <div class="chat-item-name">${chatName}</div>
                        <div class="chat-item-preview">No messages yet</div>
                    </div>
                    <button class="delete-chat-btn" data-action="delete">×</button>
                </div>
            `;
        }

        function addMessage(text, isUser = true) {
            const message = {
                text: text,
                isUser: isUser,
                time: formatTime()
            };
            
            allChats[currentChat].push(message);
            renderMessages();
            updateChatPreview(currentChat, text);
        }

        function updateChatPreview(chatKey, lastMessage) {
            const chatItem = document.querySelector(`[data-chat="${chatKey}"]`);
            if (chatItem) {
                const preview = chatItem.querySelector('.chat-item-preview');
                preview.textContent = lastMessage.length > 30 ? lastMessage.substring(0, 30) + '...' : lastMessage;
            }
        }

        function renderMessages() {
            const messages = allChats[currentChat];
            
            if (messages.length === 0) {
                chatMessages.innerHTML = '<div class="empty-state">Start a conversation...</div>';
                return;
            }

            chatMessages.innerHTML = messages.map(msg => `
                <div class="message ${msg.isUser ? 'user' : 'other'}">
                    <div>${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                </div>
            `).join('');
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function switchChat(chatKey) {
            currentChat = chatKey;
            
            // Update active state
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-chat="${chatKey}"]`).classList.add('active');
            
            // Update chat name
            currentChatName.textContent = chatNames[chatKey];
            
            // Render messages for current chat
            renderMessages();
        }

        function createNewChat() {
            const chatName = chatNameInput.value.trim();
            if (!chatName) return;
            
            const chatKey = generateChatId();
            allChats[chatKey] = [];
            chatNames[chatKey] = chatName;
            
            // Add to sidebar
            const chatItem = createChatItem(chatKey, chatName);
            chatList.insertAdjacentHTML('beforeend', chatItem);
            
            // Switch to new chat
            switchChat(chatKey);
            
            // Close modal and reset
            createChatModal.classList.remove('show');
            chatNameInput.value = '';
        }

        function deleteChat(chatKey) {
            // Don't delete if it's the last chat
            if (Object.keys(allChats).length <= 1) {
                alert('Cannot delete the last chat!');
                return;
            }
            
            // Remove from data
            delete allChats[chatKey];
            delete chatNames[chatKey];
            
            // Remove from DOM
            const chatItem = document.querySelector(`[data-chat="${chatKey}"]`);
            if (chatItem) {
                chatItem.remove();
            }
            
            // Switch to first available chat if current chat was deleted
            if (currentChat === chatKey) {
                const firstChatKey = Object.keys(allChats)[0];
                switchChat(firstChatKey);
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, true);
                messageInput.value = '';
                
                // Simulate a response after a short delay
                setTimeout(() => {
                    const responses = [
                        "Thanks for your message!",
                        "I received that.",
                        "Interesting point!",
                        "Got it!",
                        "Message received.",
                        "Thanks for sharing!"
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(randomResponse, false);
                }, 1000);
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        messageInput.addEventListener('input', () => {
            sendButton.disabled = messageInput.value.trim() === '';
        });

        // Chat management
        addChatBtn.addEventListener('click', () => {
            createChatModal.classList.add('show');
            chatNameInput.focus();
        });

        createBtn.addEventListener('click', createNewChat);

        cancelBtn.addEventListener('click', () => {
            createChatModal.classList.remove('show');
            chatNameInput.value = '';
        });

        chatNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                createNewChat();
            }
        });

        // Chat switching and deletion
        chatList.addEventListener('click', (e) => {
            if (e.target.dataset.action === 'delete') {
                e.stopPropagation();
                const chatItem = e.target.closest('.chat-item');
                if (chatItem) {
                    const chatKey = chatItem.dataset.chat;
                    if (confirm('Are you sure you want to delete this chat?')) {
                        deleteChat(chatKey);
                    }
                }
            } else {
                const chatItem = e.target.closest('.chat-item');
                if (chatItem) {
                    const chatKey = chatItem.dataset.chat;
                    switchChat(chatKey);
                }
            }
        });

        // Close modal when clicking outside
        createChatModal.addEventListener('click', (e) => {
            if (e.target === createChatModal) {
                createChatModal.classList.remove('show');
                chatNameInput.value = '';
            }
        });

        // Initialize
        sendButton.disabled = true;
    </script>
</body>
</html>
