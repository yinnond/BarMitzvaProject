<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BARMITZVAPROJECT - ALPHA</title>
  <style>
    :root {
      --bg-color: #f5f5f5;
      --container-bg: #ffffff;
      --text-color: #222222;
      --user-msg-bg: #d1fae5;
      --other-msg-bg: #e5e7eb;
      --input-bg: #ffffff;
      --primary-color: #10b981;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    body.dark {
      --bg-color: #1e1e1e;
      --container-bg: #2a2a2a;
      --text-color: #f5f5f5;
      --user-msg-bg: #065f46;
      --other-msg-bg: #374151;
      --input-bg: #1f2937;
      --primary-color: #34d399;
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .chat-selector {
      flex-grow: 1;
      margin-right: 10px;
    }

    .chat-container {
      background: var(--container-bg);
      width: 100%;
      max-width: 600px;
      height: 600px;
      border-radius: 16px;
      box-shadow: 0 20px 40px var(--shadow-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      animation: slideIn 0.3s ease-out;
      word-wrap: break-word;
      position: relative;
    }

    .message.user {
      background: var(--user-msg-bg);
      color: black;
      align-self: flex-end;
    }

    .message.other {
      background: var(--other-msg-bg);
      color: black;
      align-self: flex-start;
    }

    .delete-btn {
      position: absolute;
      top: 2px;
      right: 8px;
      background: transparent;
      border: none;
      color: red;
      font-weight: bold;
      cursor: pointer;
    }

    .message-time {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .chat-input-container {
      padding: 20px;
      display: flex;
      gap: 10px;
      background: var(--input-bg);
      border-top: 1px solid #ccc;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 20px;
      border: 2px solid #ccc;
      outline: none;
      background: var(--input-bg);
      color: var(--text-color);
    }

    .send-button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .settings-button {
      padding: 8px 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      color: #aaa;
      font-style: italic;
      margin-top: 50px;
    }

    .settings-gear {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--primary-color);
      margin-left: 8px;
      transition: color 0.2s;
    }
    .settings-gear:hover {
      color: #0e7c5a;
    }
    .settings-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.3);
      justify-content: center;
      align-items: center;
    }
    .settings-modal.active {
      display: flex;
    }
    .settings-panel {
      background: var(--container-bg);
      color: var(--text-color);
      border-radius: 16px;
      box-shadow: 0 8px 32px var(--shadow-color);
      padding: 32px 28px 24px 28px;
      min-width: 320px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }
    .settings-panel h2 {
      margin-bottom: 10px;
      font-size: 20px;
      text-align: center;
    }
    .settings-panel label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .settings-panel input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: none;
      cursor: pointer;
    }
    .settings-close {
      position: absolute;
      top: 10px;
      right: 16px;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-color);
      cursor: pointer;
    }
    .wallpaper-preview {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      margin-top: 4px;
      background-size: cover;
      background-position: center;
      border: 1px solid #ccc;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <select id="chatSelect" class="chat-selector"></select>
    <button class="settings-gear" id="openSettings" title="Settings" aria-label="Settings">⚙️</button>
  </div>
  <div class="chat-container">
    <div class="chat-header">BARMITZVAPROJECT - ALPHA</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-container">
      <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." maxlength="500">
      <button class="send-button" id="sendButton" disabled>Send</button>
    </div>
  </div>
  <div class="settings-modal" id="settingsModal">
    <div class="settings-panel">
      <button class="settings-close" id="closeSettings" title="Close">&times;</button>
      <h2>Settings</h2>
      <label>
        Theme:
        <select id="themeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>
        Wallpaper:
        <input type="color" id="wallpaperColor" title="Pick a background color" />
        <input type="file" id="wallpaperFile" accept="image/*" style="margin-left:8px;" />
      </label>
      <div class="wallpaper-preview" id="wallpaperPreview"></div>
      <label>
        User Chat Color:
        <input type="color" id="userColor" />
      </label>
      <label>
        Other Chat Color:
        <input type="color" id="otherColor" />
      </label>
    </div>
  </div>

  <script>
    const chatSelect = document.getElementById("chatSelect");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");

    const defaultChats = ["General", "Friends", "Study"];
    const chatData = {};

    defaultChats.forEach(name => {
      chatData[name] = [{ text: `Welcome to BARMITZVAPROJECT - ALPHA, ask anything!`, isUser: false, time: formatTime() }];
    });

    function formatTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function populateChatSelect() {
      chatSelect.innerHTML = Object.keys(chatData).map(key => `<option value="${key}">${key}</option>`).join('');
    }

    function renderMessages() {
      const messages = chatData[chatSelect.value] || [];
      if (messages.length === 0) {
        chatMessages.innerHTML = '<div class="empty-state">Start a conversation...</div>';
        return;
      }
      chatMessages.innerHTML = messages.map((msg, index) => `
        <div class="message ${msg.isUser ? 'user' : 'other'}">
          <button class="delete-btn" onclick="deleteMessage(${index})">x</button>
          <div>${msg.text}</div>
          <div class="message-time">${msg.time}</div>
        </div>
      `).join('');
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      const msg = { text, isUser: true, time: formatTime() };
      chatData[chatSelect.value].push(msg);
      messageInput.value = "";
      sendButton.disabled = true;
      renderMessages();
      setTimeout(() => {
        const reply = { text: "Thanks for your message!", isUser: false, time: formatTime() };
        chatData[chatSelect.value].push(reply);
        renderMessages();
      }, 1000);
    }

    function deleteMessage(index) {
      chatData[chatSelect.value].splice(index, 1);
      renderMessages();
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    // Init
    populateChatSelect();
    renderMessages();
    chatSelect.addEventListener("change", renderMessages);
    messageInput.addEventListener("input", () => sendButton.disabled = !messageInput.value.trim());
    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

    // Settings panel logic
    const openSettings = document.getElementById('openSettings');
    const closeSettings = document.getElementById('closeSettings');
    const settingsModal = document.getElementById('settingsModal');
    const themeSelect = document.getElementById('themeSelect');
    const wallpaperColor = document.getElementById('wallpaperColor');
    const wallpaperFile = document.getElementById('wallpaperFile');
    const wallpaperPreview = document.getElementById('wallpaperPreview');
    const userColor = document.getElementById('userColor');
    const otherColor = document.getElementById('otherColor');

    // Load settings from localStorage
    function loadSettings() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.body.classList.add('dark');
        themeSelect.value = 'dark';
      } else {
        document.body.classList.remove('dark');
        themeSelect.value = 'light';
      }
      const wallColor = localStorage.getItem('wallpaperColor');
      if (wallColor) {
        document.body.style.backgroundImage = '';
        document.body.style.backgroundColor = wallColor;
        wallpaperColor.value = wallColor;
        wallpaperPreview.style.background = wallColor;
      } else {
        document.body.style.backgroundColor = '';
        wallpaperPreview.style.background = '';
      }
      const wallImg = localStorage.getItem('wallpaperImage');
      if (wallImg) {
        document.body.style.backgroundImage = `url('${wallImg}')`;
        wallpaperPreview.style.backgroundImage = `url('${wallImg}')`;
      } else {
        document.body.style.backgroundImage = '';
        wallpaperPreview.style.backgroundImage = '';
      }
      const userCol = localStorage.getItem('userColor');
      if (userCol) {
        document.documentElement.style.setProperty('--user-msg-bg', userCol);
        userColor.value = userCol;
      }
      const otherCol = localStorage.getItem('otherColor');
      if (otherCol) {
        document.documentElement.style.setProperty('--other-msg-bg', otherCol);
        otherColor.value = otherCol;
      }
    }
    loadSettings();

    openSettings.onclick = () => {
      settingsModal.classList.add('active');
    };
    closeSettings.onclick = () => {
      settingsModal.classList.remove('active');
    };
    settingsModal.onclick = (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('active');
    };

    themeSelect.onchange = () => {
      if (themeSelect.value === 'dark') {
        document.body.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    };
    wallpaperColor.oninput = () => {
      document.body.style.backgroundImage = '';
      document.body.style.backgroundColor = wallpaperColor.value;
      wallpaperPreview.style.background = wallpaperColor.value;
      wallpaperPreview.style.backgroundImage = '';
      localStorage.setItem('wallpaperColor', wallpaperColor.value);
      localStorage.removeItem('wallpaperImage');
    };
    wallpaperFile.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.body.style.backgroundImage = `url('${ev.target.result}')`;
        wallpaperPreview.style.backgroundImage = `url('${ev.target.result}')`;
        wallpaperPreview.style.background = '';
        localStorage.setItem('wallpaperImage', ev.target.result);
        localStorage.removeItem('wallpaperColor');
      };
      reader.readAsDataURL(file);
    };
    userColor.oninput = () => {
      document.documentElement.style.setProperty('--user-msg-bg', userColor.value);
      localStorage.setItem('userColor', userColor.value);
    };
    otherColor.oninput = () => {
      document.documentElement.style.setProperty('--other-msg-bg', otherColor.value);
      localStorage.setItem('otherColor', otherColor.value);
    };
  </script>
</body>
</html>
