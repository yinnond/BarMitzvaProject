<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>צ'אט בר מצווה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        #sidebar {
            width: 200px;
            background: #e0ffe0;
            padding: 10px;
            overflow-y: auto;
            border-left: 2px solid #99cc99;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        .user-message {
            background: #00ff99;
            color: #000;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            max-width: 80%;
            align-self: flex-start;
        }
        .bot-message {
            background: #aaffcc;
            color: #000;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            max-width: 80%;
            align-self: flex-end;
        }
        #input-form {
            display: flex;
            padding: 10px;
            background: #fff;
        }
        #input-form input {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            margin-left: 5px;
        }
        #input-form button {
            padding: 8px 12px;
            font-size: 16px;
        }
        .session-title {
            background: #ccffcc;
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .session-title.active {
            background: #99ff99;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="sidebar">
    <h4>שיחות</h4>
    <div id="sessions"></div>
</div>
<div id="chat-container">
    <div id="messages"></div>
    <form id="input-form">
        <input type="text" id="user-input" placeholder="כתוב שאלה על בר מצווה..." required>
        <button type="submit">שלח</button>
    </form>
</div>

<script>
    let sessions = [];
    let currentSessionIndex = -1;

    function createNewSession(question) {
        sessions.push({ question, messages: [] });
        currentSessionIndex = sessions.length - 1;
        renderSessions();
        addMessage('user', question);
        botResponse(question);
    }

    function addMessage(sender, text) {
        if (currentSessionIndex === -1) return;
        sessions[currentSessionIndex].messages.push({ sender, text });
        renderMessages();
    }

    function renderMessages() {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        sessions[currentSessionIndex].messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = msg.sender === 'user' ? 'user-message' : 'bot-message';
            div.textContent = msg.text;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function renderSessions() {
        const side = document.getElementById('sessions');
        side.innerHTML = '';
        sessions.forEach((sess, index) => {
            const div = document.createElement('div');
            div.className = 'session-title' + (index === currentSessionIndex ? ' active' : '');
            div.textContent = sess.question;
            div.onclick = () => {
                currentSessionIndex = index;
                renderSessions();
                renderMessages();
            };
            side.appendChild(div);
        });
    }

    function botResponse(userText) {
        setTimeout(() => {
            const response = generateBotAnswer(userText);
            addMessage('bot', response);
        }, 500);
    }

    function generateBotAnswer(text) {
        // תשובות דמה
        if (text.includes('מה')) return "בר מצווה זה גיל 13 שבו חוגגים מעבר לבגרות.";
        if (text.includes('איך')) return "חוגגים לרוב עם עלייה לתורה, מסיבה ואוכל טוב!";
        return "שאלה יפה על בר מצווה! בדרך כלל חוגגים עם המשפחה והחברים.";
    }

    document.getElementById('input-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        if (currentSessionIndex === -1) {
            createNewSession(text);
        } else {
            addMessage('user', text);
            botResponse(text);
        }
        input.value = '';
    };
</script>
</body>
</html>
